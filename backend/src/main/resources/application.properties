# ==========================================================
# CSE Hub - Backend Configuration
# ==========================================================

server.port=8080

# ---- MySQL connection ----
# Create the database first: CREATE DATABASE cse_hub;
spring.datasource.url=jdbc:mysql://localhost:3306/cse_hub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# 'update' will auto-create/alter tables based on the entities below.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# ---- Seed data ----
# data.sql runs after Hibernate creates the schema (see defer-datasource-initialization above).
# It only inserts rows the first time, guarded by NOT EXISTS checks.
spring.sql.init.mode=always

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- File uploads (resources, thumbnails, banner) ----
# Files are stored on local disk under this directory (relative to the
# working directory the app is started from) and served back at /uploads/**.
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
